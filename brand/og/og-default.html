<!doctype html>
<!-- Template for public/og-default.png. Render with `npm run render:og`. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../src/styles/tokens.css" />
    <style>
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 600;
        src: url(../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-600-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "Barlow Condensed";
        font-weight: 800;
        src: url(../../node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-normal.woff2) format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 500;
        src: url(../../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2) format("woff2");
      }

      * { margin: 0; box-sizing: border-box; }

      html, body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      body {
        position: relative;
        background: var(--ink);
        color: var(--paper);
        padding: 72px 80px;
        font-family: var(--font-display);
      }

      /* Faint architect grid */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--ink-2) 1px, transparent 1px),
          linear-gradient(90deg, var(--ink-2) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .content {
        position: relative;
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .label {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 22px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--noor);
      }

      .wordmark {
        margin-top: 36px;
        font-size: 168px;
        line-height: 0.88;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.01em;
      }

      .wordmark .noor { color: var(--noor); }
      .wordmark .rest { display: block; font-weight: 600; }

      .dim {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: auto;
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: 20px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--concrete-500);
      }

      .dim .line {
        position: relative;
        flex: 1;
        height: 2px;
        background: var(--concrete-700);
      }

      .dim .line::before,
      .dim .line::after {
        content: "";
        position: absolute;
        top: -10px;
        width: 2px;
        height: 22px;
        background: var(--concrete-500);
      }

      .dim .line::before { left: 0; }
      .dim .line::after { right: 0; }

      .bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 12px;
        background: var(--noor);
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="content">
      <p class="label">Building the Future</p>
      <h1 class="wordmark"><span class="noor">Noor</span><span class="rest">Developers</span></h1>
      <div class="dim">
        <span>Faisalabad</span>
        <span class="line"></span>
        <span>noordevelopers.pk</span>
      </div>
    </div>
    <div class="bar"></div>
  </body>
</html>
